<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GramMitra — Offline Mode | మా ఊరు డిజిటల్ సేవలు</title>
  <link rel="icon" type="image/svg+xml" href="/site-icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0d1e16;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(22, 48, 36, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.1));
      border: 2px solid rgba(16, 185, 129, 0.4);
      border-radius: 1.5rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
    }
    .icon-wrapper img {
      width: 44px;
      height: 44px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    .telugu-sub {
      font-size: 0.95rem;
      font-weight: 600;
      color: #34d399;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 0.875rem;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
      transition: transform 0.15s ease, background 0.2s ease;
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #d1d5db;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 0.75rem;
      box-shadow: none;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span> Offline Mode
    </div>

    <div class="icon-wrapper">
      <img src="/site-icon.svg" alt="GramMitra Logo">
    </div>

    <h1>No Internet Connection</h1>
    <div class="telugu-sub">నెట్‌వర్క్ అందుబాటులో లేదు — గ్రామ్‌మిత్ర ఆఫ్ లైన్ మోడ్</div>

    <p>
      You are currently offline. Don't worry — cached notices, village profiles, and saved contact numbers remain accessible.
    </p>

    <button class="btn" onclick="window.location.reload()">
      🔄 Try Reconnecting / మళ్లీ ప్రయత్నించండి
    </button>
    <a href="/" class="btn btn-secondary">
      🏡 Go to Home Page
    </a>
  </div>
</body>
</html>
